name: Images

# Builds the api and web images. On pushes to main they are pushed to Harbor,
# tagged with the commit SHA (plus `latest`); pull requests that touch the image
# build only build them (no push). Registry settings are repository variables,
# so swapping registry/project needs no edit here.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/docker/**
      - docs/**
      - package-lock.json
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Required to push, e.g. `registry.drowranger.com` (no scheme).
  REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  # Harbor project the images live in.
  PROJECT: ${{ vars.HARBOR_PROJECT || 'patent' }}
  # Repository name prefix: images are <prefix>-api, <prefix>-web.
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'patent' }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          if [ "$PUSH" = true ] && [ -z "$REGISTRY" ]; then
            echo "::error::Repository variable HARBOR_REGISTRY is not set; cannot push."
            exit 1
          fi
          repo="${REGISTRY:-local}/${PROJECT}/${IMAGE_PREFIX}-${{ matrix.target }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$repo:${{ github.sha }}"
            if [ "${{ github.ref }}" = refs/heads/main ]; then echo "$repo:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # The api image is smoke-tested BEFORE it is pushed: build it into the
      # local Docker daemon (same cache as the push build, so the push step below
      # is a cache hit), start it, and check that /api/healthz reports the
      # research documents present and that the research import works from the
      # files shipped in the image (see deploy/docker/api-smoke-test.sh).
      - name: Build api image for the smoke test
        if: matrix.target == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: patent-api:smoke
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke test the api image (healthz researchDocs, research import)
        if: matrix.target == 'api'
        run: deploy/docker/api-smoke-test.sh patent-api:smoke

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # GitOps hand-off: point the Argo CD overlay at the images just pushed. Argo
  # picks the commit up on its next reconcile. Opt in with the repository
  # variable ARGOCD_GITOPS_BUMP=true.
  bump-deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ARGOCD_GITOPS_BUMP == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bump-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set image tags in the production overlay
        working-directory: deploy/k8s/overlays/production
        run: |
          for t in api web; do
            kustomize edit set image \
              "patent-$t=${REGISTRY}/${PROJECT}/${IMAGE_PREFIX}-$t:${{ github.sha }}"
          done
      - name: Commit and push
        # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then echo "Already up to date."; exit 0; fi
          git commit -m "chore(deploy): images → ${GITHUB_SHA::7} [skip ci]"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
