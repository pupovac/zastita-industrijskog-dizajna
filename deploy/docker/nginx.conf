# nginx for the web image (unprivileged, listens on 8080).
#
# Single-host design: the browser talks only to this nginx. Static SPA assets
# are served from disk; anything under /api is reverse-proxied to the api
# Service inside the cluster. The web client uses a relative `/api` base
# (apps/web/src/api/client.ts), so no CORS and no API hostname are involved.

# DNS resolver = the in-cluster CoreDNS, so the api Service name resolves and
# nginx starts even if the api pod is not ready yet (proxy_pass via a variable
# defers resolution to request time instead of failing at config load).
resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded documents and generated packages can be large (PDF/DOCX).
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness/readiness for the web pod.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend. The trailing-slash-free prefix matches both `/api` and `/api/...`.
    # $api_upstream in a variable forces runtime DNS resolution (see resolver).
    location /api {
        set $api_upstream http://patent-api.patent.svc.cluster.local:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation (PDF/DOCX) can take a few seconds.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite fingerprints everything under /assets, so cache it forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html (never cached).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
