apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patent
resources:
- ../../base
  # Pin every workload to the home nodes (amd64; local-path storage is there).
patches:
- path: ingress.yaml
  target:
    kind: Ingress
    name: patent
- path: node-selector.yaml
  target:
    kind: Deployment
  # CI (the images workflow's bump job) rewrites newTag to the built commit SHA
  # and commits here; Argo CD then rolls it out. They start at :latest for the
  # very first sync before any bump has happened.
images:
- name: patent-api
  newName: registry.drowranger.com/patent/patent-api
  newTag: ca5ae4b41ac79f5efaac41566ad37b4b7eb56e8d
- name: patent-web
  newName: registry.drowranger.com/patent/patent-web
  newTag: ca5ae4b41ac79f5efaac41566ad37b4b7eb56e8d
